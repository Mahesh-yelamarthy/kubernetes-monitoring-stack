global:
  resolve_timeout: 5m

route:
  receiver: platform-default
  group_by:
    - cluster
    - namespace
    - severity
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: platform-critical
      matchers:
        - severity="critical"
      group_wait: 15s
      repeat_interval: 30m
      continue: false

    - receiver: platform-warning
      matchers:
        - severity="warning"
      repeat_interval: 2h
      continue: false

    - receiver: platform-heartbeat
      matchers:
        - alertname="Watchdog"
      repeat_interval: 5m
      continue: false

    - receiver: platform-default
      matchers:
        - severity="info"
      repeat_interval: 12h
      continue: false

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - cluster
      - namespace
      - alertname

receivers:
  - name: platform-default
    webhook_configs:
      - url: http://alert-router.monitoring.svc.cluster.local:8080/alerts/default
        send_resolved: true
        max_alerts: 20

  - name: platform-warning
    webhook_configs:
      - url: http://alert-router.monitoring.svc.cluster.local:8080/alerts/warning
        send_resolved: true
        max_alerts: 20

  - name: platform-critical
    webhook_configs:
      - url: http://alert-router.monitoring.svc.cluster.local:8080/alerts/critical
        send_resolved: true
        max_alerts: 10

  - name: platform-heartbeat
    webhook_configs:
      - url: http://alert-router.monitoring.svc.cluster.local:8080/alerts/heartbeat
        send_resolved: true
        max_alerts: 5
